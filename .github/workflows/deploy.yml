name: Deploy to GitHub Pages

# Every push to main builds the site and publishes it. A failing build fails
# the deploy, so a broken page never replaces a working one.
#
# NOTE ON URLS: a GitHub Pages *project* site is served from
# https://<user>.github.io/<repo>/, not from a domain root. The two env vars
# below feed `site` and `base` in astro.config.mjs so canonical URLs, the
# sitemap and every internal link carry that prefix. They come from
# actions/configure-pages rather than being hardcoded, so renaming the repo or
# attaching a custom domain does not require editing this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway, but only queue
# one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
